<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pengurusan Program PTSS - Log Masuk & Pendaftaran</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before, body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.5;
    }
    body::before {
      background: #4f46e5;
      top: -50px;
      left: -50px;
    }
    body::after {
      background: #c026d3;
      bottom: -50px;
      right: -50px;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.125);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      color: #ffffff;
      text-align: center;
    }

    .logo-container {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      font-size: 28px;
    }

    .title-area h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-area p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    /* Tab Switcher Style */
    .tab-container {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .input-wrapper input::placeholder {
      color: #64748b;
      text-transform: none;
    }

    .input-wrapper input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
      background: rgba(15, 23, 42, 0.8);
    }

    .input-wrapper input:focus + i {
      color: #a855f7;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(99, 102, 241, 0.4);
      opacity: 0.95;
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .alert {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .footer-text {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }
      .title-area h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-container">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    
    <div class="title-area">
      <h2>Politeknik Tuanku Syed Sirajuddin</h2>
      <p>Sistem Pengurusan Program PTSS & Kaunseling</p>
    </div>

    <!-- Tab Switcher -->
    <div class="tab-container">
      <button class="tab-btn active" onclick="switchTab('signin')">Log Masuk</button>
      <button class="tab-btn" onclick="switchTab('signup')">Daftar Akaun</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- Form Sign In -->
    <form id="signInForm" class="form-section active">
      <div class="form-group">
        <label for="signinMatrix">Nombor Matrik Pelajar</label>
        <div class="input-wrapper">
          <input type="text" id="signinMatrix" placeholder="Contoh: 18DIT26F1128" required autocomplete="off">
          <i class="fa-solid fa-id-card"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="signInBtn">
        <span>Log Masuk</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <!-- Form Sign Up -->
    <form id="signUpForm" class="form-section">
      <div class="form-group">
        <label for="signupName">Nama Penuh (Huruf Besar)</label>
        <div class="input-wrapper">
          <input type="text" id="signupName" placeholder="NAMA PENUH SEPERTI REKOD" required autocomplete="off">
          <i class="fa-solid fa-user"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="signupMatrix">Nombor Matrik Pelajar</label>
        <div class="input-wrapper">
          <input type="text" id="signupMatrix" placeholder="Contoh: 18DIT26F1128" required autocomplete="off">
          <i class="fa-solid fa-id-card"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="signUpBtn">
        <span>Daftar Akaun</span>
        <i class="fa-solid fa-user-plus"></i>
      </button>
    </form>

    <div class="footer-text">
      &copy; 2026 Kelab Komputer PTSS & Unit Kaunseling
    </div>
  </div>

  <!-- Firebase Script (Modular ES6) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBLj5KhjrWRh9mGkHHArkhL7fKGhylrbTQ",
      authDomain: "kelab-komputer-ptss.firebaseapp.com",
      projectId: "kelab-komputer-ptss",
      storageBucket: "kelab-komputer-ptss.firebasestorage.app",
      messagingSenderId: "456747248595",
      appId: "1:456747248595:web:fe457efde4d97d6241dd26",
      measurementId: "G-7BZDXS41V8"
    };

    // Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Senarai Master Data Pelajar (Untuk Verifikasi Utama)
    const masterStudentsList = [
      { name: "MUHAMMAD IKQRAM ZULFIQQAR BIN IDRIS", matrixNo: "18DIT26F1128" },
      { name: "NURFARISHA BINTI MOHD FAIRUZ", matrixNo: "18DAC26F1024" },
      { name: "KISHOR A/L LINGESWARAN", matrixNo: "18DPM26F1010" },
      { name: "'ALIAA HUSNA BINTI MOHAMMAD IZHAR", matrixNo: "18DIT26F1135" },
      { name: "MUHAMAD HARIES BIN MUHAMAD HAFIZ", matrixNo: "18DIT26F1103" },
      { name: "NUR DAMIA NATASYA BINTI ABDULLAH", matrixNo: "18DIT26F1083" },
      { name: "HANG HAN", matrixNo: "18DIT26F1075" },
      { name: "MUHAMAD AFIQ AIMAN BIN ZULKIPLI", matrixNo: "18DIT26F1113" },
      { name: "NUR MIMHAH MIRZA", matrixNo: "18DKE26F1150" },
      { name: "AUNI SYUHADA BINTI SALIM", matrixNo: "18DIT26F1062" },
      { name: "KIRANT A/P SIVA KUMAR", matrixNo: "18DIT26F1061" },
      { name: "ONG ZI REN", matrixNo: "18DKE26F1016" },
      { name: "WONG ZHENG YUAN", matrixNo: "18DKM26F1012" },
      { name: "SITI NUR BAHIYYAH BINTI SUHAIZAM", matrixNo: "18DEP26F1097" },
      { name: "ENG JO YAN", matrixNo: "18DEV26F1006" },
      { name: "NUR KHAYRA DAMIA BINTI HASRUL NIZAM", matrixNo: "18DUP26F1054" },
      { name: "LEE HAN JIN", matrixNo: "18DIT26F1033" },
      { name: "MUHAMMAD IRFAN HARITH BIN MOHD HERMAN", matrixNo: "18DIT26F1067" },
      { name: "YEOH CHENG YI", matrixNo: "18DIT26F1095" },
      { name: "INTAN MARLIA SYAFINA BINTI ABU SEMAN", matrixNo: "18DUP26F1002" },
      { name: "RUBASERI", matrixNo: "18DUP26F1023" },
      { name: "MUHAMMAD DANIEL FIRDAUS BIN MUHAMAD SUFIAN", matrixNo: "18DEPF1064" },
      { name: "CHING JIN ZHE", matrixNo: "18DIT26F1016" },
      { name: "MUHAMMAD IMAN SYAQIRIEN BIN MOHD IZANI", matrixNo: "18DKE26F1109" },
      { name: "NUR NAJLAA BINTI RAHMAN", matrixNo: "18DIT26F1036" },
      { name: "ROSFARHANA BINTI SHAMSUDDIN", matrixNo: "18DEP26F1009" },
      { name: "MUHAMMAD SHAHRIZAL BIN SHAHIDAN", matrixNo: "18DKE26F1057" },
      { name: "NUR SYAHIRA BINTI KAMAL HISYAM", matrixNo: "18DEP26F1011" },
      { name: "TEOH QIAN HOOI", matrixNo: "18DIT26F1017" },
      { name: "ONG SIM LOK", matrixNo: "18DIT26F1127" }
    ];

    // Elemen DOM
    const signInForm = document.getElementById('signInForm');
    const signUpForm = document.getElementById('signUpForm');
    const alertBox = document.getElementById('alertBox');
    const signinMatrix = document.getElementById('signinMatrix');
    const signupName = document.getElementById('signupName');
    const signupMatrix = document.getElementById('signupMatrix');
    const signInBtn = document.getElementById('signInBtn');
    const signUpBtn = document.getElementById('signUpBtn');

    // Auto-Uppercase input
    [signinMatrix, signupName, signupMatrix].forEach(input => {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.toUpperCase();
      });
    });

    // Fungsi Tukar Tab UI
    window.switchTab = function(type) {
      alertBox.style.display = 'none';
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(btn => btn.classList.remove('active'));

      if (type === 'signin') {
        tabs[0].classList.add('active');
        signInForm.classList.add('active');
        signUpForm.classList.remove('active');
      } else {
        tabs[1].classList.add('active');
        signUpForm.classList.add('active');
        signInForm.classList.remove('active');
      }
    };

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }

    // 1. PENGENDALI PENDAFTARAN (SIGN UP)
    signUpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputName = signupName.value.trim().toUpperCase();
      const inputMatrix = signupMatrix.value.trim().toUpperCase();

      if (!inputName || !inputMatrix) {
        showAlert("Sila isi semua maklumat.", "error");
        return;
      }

      signUpBtn.disabled = true;
      signUpBtn.innerHTML = `<span>Memverifikasi...</span>`;

      // Semakan padanan nama dan nombor matrik dalam Master List
      const validStudent = masterStudentsList.find(
        (s) => s.matrixNo.toUpperCase() === inputMatrix && s.name.toUpperCase() === inputName
      );

      if (!validStudent) {
        showAlert("Nama atau Nombor Matrik tidak sepadan dengan rekod sah!", "error");
        signUpBtn.disabled = false;
        signUpBtn.innerHTML = `<span>Daftar Akaun</span> <i class="fa-solid fa-user-plus"></i>`;
        return;
      }

      try {
        const studentRef = doc(db, "registered_students", inputMatrix);
        const docSnap = await getDoc(studentRef);

        if (docSnap.exists()) {
          showAlert("Nombor Matrik ini sudah mendaftar. Sila Log Masuk.", "error");
        } else {
          // Simpan ke Firestore
          await setDoc(studentRef, {
            name: inputName,
            matrixNo: inputMatrix,
            registeredAt: new Date().toISOString(),
            hasVoted: false
          });

          showAlert("Pendaftaran Berjaya! Sila log masuk.", "success");
          setTimeout(() => {
            switchTab('signin');
            signinMatrix.value = inputMatrix;
          }, 1500);
        }
      } catch (err) {
        console.error("Firestore Error:", err);
        showAlert("Ralat sistem semasa mendaftar. Sila cuba lagi.", "error");
      } finally {
        signUpBtn.disabled = false;
        signUpBtn.innerHTML = `<span>Daftar Akaun</span> <i class="fa-solid fa-user-plus"></i>`;
      }
    });

    // 2. PENGENDALI LOG MASUK (SIGN IN)
    signInForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputMatrix = signinMatrix.value.trim().toUpperCase();

      if (!inputMatrix) {
        showAlert("Sila masukkan Nombor Matrik.", "error");
        return;
      }

      signInBtn.disabled = true;
      signInBtn.innerHTML = `<span>Menyemak...</span>`;

      try {
        const studentRef = doc(db, "registered_students", inputMatrix);
        const docSnap = await getDoc(studentRef);

        if (docSnap.exists()) {
          const studentData = docSnap.data();
          showAlert(`Selamat Datang, ${studentData.name}!`, "success");

          // Simpan maklumat sesi pengguna ke LocalStorage
          localStorage.setItem("userSession", JSON.stringify(studentData));

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } else {
          showAlert("Akaun belum didaftarkan. Sila klik 'Daftar Akaun' dahulu.", "error");
        }
      } catch (err) {
        console.error("Firestore Error:", err);
        showAlert("Ralat sistem semasa log masuk. Sila cuba lagi.", "error");
      } finally {
        signInBtn.disabled = false;
        signInBtn.innerHTML = `<span>Log Masuk</span> <i class="fa-solid fa-arrow-right"></i>`;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistem Pengurusan Program PTSS</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #ffffff;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Decorative background elements */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.35;
    }
    body::before {
      background: #4f46e5;
      top: -100px;
      left: -100px;
    }
    body::after {
      background: #c026d3;
      top: 50px;
      right: -100px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header Profile Card (Kotak Pengguna) */
    .profile-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.125);
      border-radius: 20px;
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      margin-bottom: 30px;
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .profile-avatar {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }

    .profile-details h1 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .profile-details .matrix-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #c084fc;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* Kraf Kandungan Dashboard Utama */
    .dashboard-content {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px;
    }

    .welcome-banner {
      margin-bottom: 32px;
    }

    .welcome-banner h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-banner p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Button Pemilihan Jawatan */
    .btn-voting {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 28px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-voting:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5);
      filter: brightness(1.1);
    }

    .btn-voting:active {
      transform: translateY(-1px);
    }

    /* Gaya Jika Pengguna Dah Mengundi (Disabled) */
    .btn-voting.voted {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Responsif untuk skrin telefon bimbit */
    @media (max-width: 640px) {
      .profile-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
        padding: 20px;
      }

      .btn-logout {
        width: 100%;
        justify-content: center;
      }

      .btn-voting {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Kotak Profil Pelajar -->
    <header class="profile-card">
      <div class="profile-info">
        <div class="profile-avatar">
          <i class="fa-solid fa-user-graduate"></i>
        </div>
        <div class="profile-details">
          <h1 id="studentName">Memuatkan nama...</h1>
          <div class="matrix-tag">
            <i class="fa-solid fa-id-badge"></i>
            <span id="studentMatrix">---</span>
          </div>
        </div>
      </div>

      <button class="btn-logout" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Log Keluar</span>
      </button>
    </header>

    <!-- Ruang Kandungan Utama Dashboard -->
    <main class="dashboard-content">
      <div class="welcome-banner">
        <h2>Selamat Datang ke Dashboard</h2>
        <p>Sistem Pengurusan Program PTSS & Unit Kaunseling.</p>

        <!-- Button SISTEM PEMILIHAN JAWATAN -->
        <a href="undian.html" id="votingBtn" class="btn-voting">
          <i class="fa-solid fa-check-to-slot"></i>
          <span id="votingBtnText">SISTEM PEMILIHAN JAWATAN</span>
          <i class="fa-solid fa-arrow-right" id="votingArrow"></i>
        </a>
      </div>
    </main>
  </div>

  <!-- Firebase Script (Modular ES6) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBLj5KhjrWRh9mGkHHArkhL7fKGhylrbTQ",
      authDomain: "kelab-komputer-ptss.firebaseapp.com",
      projectId: "kelab-komputer-ptss",
      storageBucket: "kelab-komputer-ptss.firebasestorage.app",
      messagingSenderId: "456747248595",
      appId: "1:456747248595:web:fe457efde4d97d6241dd26",
      measurementId: "G-7BZDXS41V8"
    };

    // Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Semak Sesi Log Masuk daripada localStorage
    const userSession = localStorage.getItem("userSession");

    if (!userSession) {
      window.location.href = "index.html";
    } else {
      const student = JSON.parse(userSession);

      // Paparkan nama & nombor matrik asas dari LocalStorage
      document.getElementById("studentName").textContent = student.name;
      document.getElementById("studentMatrix").textContent = student.matrixNo;

      // Semak status terkini dari Firestore
      checkStudentStatus(student.matrixNo);
    }

    async function checkStudentStatus(matrixNo) {
      try {
        const studentRef = doc(db, "registered_students", matrixNo);
        const docSnap = await getDoc(studentRef);

        if (docSnap.exists()) {
          const data = docSnap.data();

          // Kemaskini nama jika ada perubahan di Firestore
          document.getElementById("studentName").textContent = data.name;

          // Semak jika pengguna sudah mengundi
          if (data.hasVoted) {
            const votingBtn = document.getElementById("votingBtn");
            const votingBtnText = document.getElementById("votingBtnText");
            const votingArrow = document.getElementById("votingArrow");

            votingBtn.classList.add("voted");
            votingBtn.removeAttribute("href");
            votingBtnText.textContent = "ANDA TELAH SELESAI MENGUNDI";
            votingArrow.className = "fa-solid fa-circle-check";
          }
        } else {
          // Jika rekod tiada dalam Firestore, paksa log keluar
          localStorage.removeItem("userSession");
          window.location.href = "index.html";
        }
      } catch (err) {
        console.error("Ralat menyemak status Firestore:", err);
      }
    }

    // Pengendali Log Keluar
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("userSession");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
